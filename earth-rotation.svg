<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">地球自转动态图片</title>
  <desc id="desc">一幅使用 SVG 和 CSS 动画绘制的地球自转图，云层和经纬线围绕地球持续移动。</desc>
  <defs>
    <radialGradient id="spaceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#16254f"/>
      <stop offset="58%" stop-color="#071329"/>
      <stop offset="100%" stop-color="#020713"/>
    </radialGradient>
    <radialGradient id="earthShade" cx="33%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#72d7ff"/>
      <stop offset="45%" stop-color="#1673db"/>
      <stop offset="78%" stop-color="#0b3a83"/>
      <stop offset="100%" stop-color="#041636"/>
    </radialGradient>
    <clipPath id="earthClip">
      <circle cx="320" cy="320" r="188"/>
    </clipPath>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .stars circle { animation: twinkle 2.8s ease-in-out infinite alternate; transform-origin: center; }
      .stars circle:nth-child(2n) { animation-delay: .5s; }
      .stars circle:nth-child(3n) { animation-delay: 1.1s; }
      .surface { animation: rotateSurface 8s linear infinite; }
      .clouds { animation: rotateClouds 5.6s linear infinite; opacity: .72; }
      .meridians { animation: rotateMeridians 4s linear infinite; }
      .axis { transform-origin: 320px 320px; animation: axisPulse 1.8s ease-in-out infinite alternate; }
      @keyframes rotateSurface { from { transform: translateX(0); } to { transform: translateX(-376px); } }
      @keyframes rotateClouds { from { transform: translateX(0); } to { transform: translateX(-376px); } }
      @keyframes rotateMeridians { from { transform: translateX(0); } to { transform: translateX(-94px); } }
      @keyframes twinkle { from { opacity: .25; transform: scale(.8); } to { opacity: 1; transform: scale(1.25); } }
      @keyframes axisPulse { from { opacity: .55; } to { opacity: .95; } }
    </style>
  </defs>

  <rect width="640" height="640" fill="url(#spaceGlow)"/>
  <g class="stars" fill="#ffffff">
    <circle cx="82" cy="95" r="2"/><circle cx="168" cy="72" r="1.5"/><circle cx="538" cy="110" r="2.3"/>
    <circle cx="586" cy="224" r="1.8"/><circle cx="83" cy="498" r="2.2"/><circle cx="512" cy="514" r="1.4"/>
    <circle cx="238" cy="566" r="1.9"/><circle cx="421" cy="52" r="1.7"/><circle cx="47" cy="304" r="1.5"/>
    <circle cx="597" cy="388" r="2"/><circle cx="290" cy="98" r="1.2"/><circle cx="139" cy="407" r="1.4"/>
  </g>

  <g transform="rotate(-23.5 320 320)">
    <line class="axis" x1="320" y1="88" x2="320" y2="552" stroke="#c9f6ff" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 12"/>
  </g>
  <path d="M205 501 C264 556, 393 556, 455 500" fill="none" stroke="#8ee8ff" stroke-width="6" stroke-linecap="round" opacity=".45"/>
  <path d="M438 484 l35 4 l-19 29" fill="none" stroke="#8ee8ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity=".65"/>

  <circle cx="320" cy="320" r="202" fill="#2bcfff" opacity=".24" filter="url(#softGlow)"/>
  <circle cx="320" cy="320" r="188" fill="url(#earthShade)"/>
  <g clip-path="url(#earthClip)">
    <g class="surface">
      <g fill="#2db76d">
        <path d="M160 265 c55-64 109-62 151-24 c-38 14-38 58-78 66 c-37 7-39-24-73-42z"/>
        <path d="M392 211 c62 16 91 67 68 111 c-38-18-88-2-104-39 c-10-23 10-50 36-72z"/>
        <path d="M265 388 c45-21 82 1 96 42 c-34 11-35 51-77 45 c-33-5-46-47-19-87z"/>
        <path d="M520 265 c55-64 109-62 151-24 c-38 14-38 58-78 66 c-37 7-39-24-73-42z"/>
        <path d="M752 211 c62 16 91 67 68 111 c-38-18-88-2-104-39 c-10-23 10-50 36-72z"/>
        <path d="M625 388 c45-21 82 1 96 42 c-34 11-35 51-77 45 c-33-5-46-47-19-87z"/>
      </g>
    </g>
    <g class="clouds" fill="#fff">
      <path d="M150 210 c35-24 74-24 110 0 c-35 22-74 22-110 0z"/>
      <path d="M325 337 c45-22 92-17 130 14 c-48 20-93 18-130-14z"/>
      <path d="M462 431 c35-20 71-16 101 10 c-36 16-72 13-101-10z"/>
      <path d="M526 210 c35-24 74-24 110 0 c-35 22-74 22-110 0z"/>
      <path d="M701 337 c45-22 92-17 130 14 c-48 20-93 18-130-14z"/>
    </g>
    <g class="meridians" fill="none" stroke="#b8edff" stroke-width="2" opacity=".28">
      <ellipse cx="226" cy="320" rx="28" ry="188"/><ellipse cx="320" cy="320" rx="58" ry="188"/>
      <ellipse cx="414" cy="320" rx="28" ry="188"/><ellipse cx="508" cy="320" rx="58" ry="188"/>
      <path d="M132 320 h376"/><path d="M153 250 c104 36 230 36 334 0"/><path d="M153 390 c104-36 230-36 334 0"/>
    </g>
    <path d="M454 163 c42 100 18 242-84 330 c85-16 150-88 150-173 c0-69-25-124-66-157z" fill="#031026" opacity=".38"/>
  </g>
  <circle cx="320" cy="320" r="188" fill="none" stroke="#a9f1ff" stroke-width="4" opacity=".62"/>
  <text x="320" y="594" text-anchor="middle" fill="#dffbff" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="26">地球自转</text>
</svg>
